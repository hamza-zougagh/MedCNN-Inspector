name: Ubuntu release gate

on:
  push:
  pull_request:

jobs:
  clean-install-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify clean checkout
        run: |
          test ! -d medcnn_runs
          test ! -d workspace_registry
          test ! -d cache
          test ! -d src
      - name: Install pinned CPU dependencies and standalone package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Verify installed package outside checkout
        run: |
          cd "$(mktemp -d)"
          python -c "import medcnn; from medcnn.catalog import list_models; print(medcnn.__file__); print(len(list_models()))"
      - name: Run standalone tests without checkpoints or datasets
        run: python -m pytest medcnn/tests -q -p no:unraisableexception
      - name: Launch Streamlit and check health endpoint
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Streamlit health endpoint returned HTTP 200"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/streamlit.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/streamlit.log"
          exit 1
